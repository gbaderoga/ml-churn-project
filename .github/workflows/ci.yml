name: CI ML Churn

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Diagnostic Python
        run: |
          echo "=== Version Python ==="
          python --version
          echo "=== Chemin Python ==="
          which python
          echo "=== Version pip ==="
          python -m pip --version

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tests
        run: |
          python -m pytest tests/ -v
