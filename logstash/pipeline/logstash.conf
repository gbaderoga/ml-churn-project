
input {
  file {
    path => "/app/logs/api.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/churn-sincedb"
    mode => "tail"
    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{GREEDYDATA:log_message}"
    }
    tag_on_failure => ["_log_parse_failure"]
  }

  date {
    match => ["log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS", "yyyy-MM-dd HH:mm:ss"]
    target => "@timestamp"
    timezone => "UTC"
  }

  mutate {
    add_field => {
      "application" => "ml-churn-api"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "churn-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}

